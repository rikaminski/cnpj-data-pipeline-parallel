[project]
name = "cnpj-data-pipeline-parallel"
version = "0.1.0"
description = "High-performance CNPJ data pipeline with parallel processing"
requires-python = ">=3.12"
dependencies = [
    "polars>=0.20.0",
    "psycopg[binary]>=3.0.0",
    "adbc-driver-postgresql>=0.8.0",
    "adbc-driver-manager>=0.8.0",
    "pyarrow>=15.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
py-modules = ["config", "database", "processor", "main", "utils"]
