# CNPJ Data Pipeline
#
# Usage:
#   docker compose up        # Run pipeline with local postgres
#   docker compose up -d     # Run in background

services:
  pipeline:
    build: .
    env_file: .env
    environment:
      # Override DATABASE_URL for container networking
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cnpj
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./temp:/app/temp
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: cnpj-pipeline-postgres
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=128MB
      -c maintenance_work_mem=4GB
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_temp_files=0
      -c wal_buffers=256MB
      -c max_wal_size=16GB
      -c checkpoint_timeout=30min
      -c synchronous_commit=off
      -c autovacuum=off
      -c fsync=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cnpj
    ports:
      - "5435:5432"
    volumes:
      - cnpj_pipeline_data:/var/lib/postgresql/data
      - ./initial.sql:/docker-entrypoint-initdb.d/initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cnpj_pipeline_data:
